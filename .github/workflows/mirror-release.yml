name: Mirror release

# Copies the latest published release to the Object Storage bucket tc-dashboard serves downloads from
# (releases/tc-station/latest/, only that version is kept). See docs/packaging.md#mirror-to-object-storage.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to mirror (empty for the latest release)
        required: false

permissions:
  contents: read

# One mirror at a time: two would race on the same keys.
concurrency:
  group: mirror-release
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, to take the install script and README of the mirrored release.
          fetch-depth: 0

      - name: Mirror
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STORAGE_S3_ENDPOINT: ${{ vars.STORAGE_S3_ENDPOINT }}
          STORAGE_S3_BUCKET: ${{ vars.STORAGE_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STORAGE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_S3_SECRET_KEY }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: bash scripts/mirror-release.sh ${TAG:+"$TAG"}
